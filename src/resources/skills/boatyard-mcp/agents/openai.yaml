interface:
  display_name: "Boatyard MCP"
  short_description: "Control Boatyard panes and TwiCC Kanban sessions"
  default_prompt: "Use $boatyard-mcp to inspect the active Boatyard layout and perform the requested pane update, web navigation, web click, form filling, visual capture, or TwiCC Kanban listing, movement, or prioritization. For Kanban mutations, use observed-snapshot tokens and an explicit affected-session bound, inspect every receipt, and never automatically replay uncertain writes."
