<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content"><meta name="theme-color" content="#192231"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="__BOATYARD_SHORT_NAME__"><meta name="boatyard-client-version" content="__BOATYARD_CLIENT_VERSION__"><title>__BOATYARD_APP_NAME__</title><link rel="icon" type="image/png" sizes="32x32" href="__BOATYARD_ICON_PATH__/favicon.png"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="__BOATYARD_ICON_PATH__/apple-touch-icon.png"><link rel="stylesheet" href="remote.css"></head>
<body>
<form id="login" hidden><h1>Sign in to Boatyard</h1><label>Password <input id="password" type="password" autocomplete="current-password" required maxlength="1024"></label><p id="loginStatus" role="alert" hidden></p><button>Sign in</button></form>
<form id="shareJoin" hidden><h1>Join a shared session</h1>
<div id="shareJoinModes" role="group" aria-label="Joining method" hidden><button id="joinWithCode" type="button" aria-pressed="true">With a code</button><button id="joinWithoutCode" type="button" aria-pressed="false">Ask to join</button></div>
<label id="accessCodeField">Access code <input id="accessCode" type="text" inputmode="numeric" autocomplete="off" placeholder="123 456" required pattern="(?:[0-9][\s\-]?){5}[0-9]" maxlength="9"></label>
<label>Your name <input id="participantName" autocomplete="name" required maxlength="80"></label>
<p id="shareJoinStatus" role="status" hidden></p><button id="joinShare" type="submit">Join</button><button id="askToJoin" type="submit" hidden>Ask to join</button><button id="cancelJoinRequest" type="button" hidden>Cancel request</button></form>
<dialog id="participantAccess"><h2>Your personal access</h2><p id="personalName"></p><p>Use this code on another device to move your connection there.</p><strong id="personalCode"></strong><label>Personal link <input id="personalLink" readonly></label><p>Keep it until this sharing session ends.</p><div><button id="copyPersonalCode" type="button">Copy code</button><button id="copyPersonalLink" type="button">Copy link</button></div><p id="personalAccessStatus" role="status"></p><button id="closeParticipantAccess" type="button">Close</button></dialog>
<div id="viewerWorkspace"><main id="surface" tabindex="0" aria-label="Remote Boatyard window" aria-describedby="viewerHint"><video id="video" autoplay playsinline muted hidden></video><audio id="voiceAudio" autoplay playsinline></audio><canvas id="frame"></canvas><span id="localCursor" hidden aria-hidden="true"></span><span id="videoDelay" hidden aria-label="Estimated video delay" title="Estimated time since the displayed video frame was created on the host"></span><div id="placeholder"><div class="waiting-copy"><span id="status" role="status">Connect to a Boatyard window to begin.</span><strong id="screenWaitingCopy" role="status" hidden>Screen sharing is paused</strong><p id="waitingHint" hidden></p><span id="waitingActivity" aria-hidden="true" hidden><i></i><i></i><i></i></span></div></div></main><aside id="chatPanel" aria-label="Session chat" hidden></aside></div>
<footer aria-label="Viewer controls">
<div class="toolbar"><strong title="__BOATYARD_APP_NAME__"><img src="__BOATYARD_ICON_PATH__/icon-192.png" alt="__BOATYARD_APP_NAME__"></strong><button id="followMouse" data-icon="mousePointer" aria-label="Follow mouse" title="Follow mouse" disabled aria-pressed="false"></button><button id="fill" data-icon="maximize" aria-label="Fill" title="Fill" disabled></button><button id="fit" data-icon="minimize" aria-label="Fit" title="Fit" disabled></button><button id="fullscreen" data-icon="fullscreen" aria-label="Fullscreen" title="Fullscreen" disabled aria-pressed="false"></button><button id="zoomIn" data-icon="zoomIn" aria-label="Zoom in" title="Zoom in" disabled></button><button id="zoomOut" data-icon="zoomOut" aria-label="Zoom out" title="Zoom out" disabled></button><button id="keyboard" data-icon="keyboard" aria-label="Keyboard" title="Keyboard" aria-pressed="false" disabled></button><button id="microphone" data-icon="micOff" aria-label="Unmute microphone" title="Unmute microphone" aria-pressed="false" disabled></button><button id="raiseHand" data-icon="hand" aria-label="Raise hand" title="Raise hand" aria-pressed="false" disabled></button><button id="listen" data-icon="volume" aria-label="Enable audio" title="Enable audio" hidden></button><button id="chat" data-icon="messageSquare" aria-label="Chat" title="Chat" aria-pressed="false" aria-controls="chatPanel" hidden></button><button id="diagnostics" data-icon="info" aria-label="Connection diagnostics" title="Connection diagnostics" aria-pressed="false"></button><button id="install" data-icon="download" aria-label="Install app" title="Install app" hidden></button><button id="disconnect" data-icon="unplug" aria-label="Disconnect" title="Disconnect" disabled></button><button id="access" data-icon="key" aria-label="Your personal access code" title="Your personal access code" hidden></button><button id="logout" data-icon="logOut" aria-label="Sign out" title="Sign out" hidden></button></div>
<span id="voiceStatus" class="sr-only" role="status"></span>
<span id="viewerHint" class="sr-only">One finger: interact · Two fingers: pan / pinch</span>
<form id="connect" hidden><label>Shared window <select id="windows"></select></label><button data-icon="play" aria-label="Connect" title="Connect"></button></form>
<form id="textForm" hidden><label>Type on remote window <input id="text" autocomplete="off"></label><button data-icon="send" aria-label="Send text" title="Send text"></button><button type="button" id="enter" data-icon="enter" aria-label="Enter" title="Enter"></button></form>
<pre id="diagnosticsPanel" hidden aria-live="off"></pre>
</footer>
<script src="client.js"></script></body></html>
